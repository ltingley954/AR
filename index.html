<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebAR Art Park - Themed Sets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
      #hud {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 12px;
        border-radius: 999px;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 10;
        font-size: 13px;
        backdrop-filter: blur(6px);
      }
      #hud select,
      #hud button {
        font-size: 13px;
        border-radius: 999px;
        border: none;
        padding: 4px 10px;
      }
      #hud select {
        background: #222;
        color: #fff;
      }
      #hud button {
        cursor: pointer;
      }
      #hint {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.5);
        color: #fff;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        z-index: 10;
        backdrop-filter: blur(6px);
      }
    </style>

    <script>
      console.log('Script loaded');

      // THEME DEFINITIONS
      const THEMES = {
        metallic: {
          name: 'Metallic',
          colors: ['#FFD700', '#C0C0C0', '#CD7F32', '#E5E4E2', '#B87333'],
          metalness: 0.95,
          roughness: 0.2,
        },
        neon: {
          name: 'Neon',
          colors: ['#39FF14', '#FF073A', '#00FFFF', '#FF6EC7', '#FFFF33'],
          metalness: 0.4,
          roughness: 0.1,
          emissiveIntensity: 0.8
        },
        glass: {
          name: 'Glass',
          colors: ['#FFFFFF', '#AEEEEE', '#E0FFFF', '#FFE4FF', '#D1EEEE'],
          metalness: 0.1,
          roughness: 0.05,
          opacity: 0.35,
          transparent: true
        },
        nature: {
          name: 'Nature',
          colors: ['#228B22', '#6B8E23', '#8FBC8F', '#2E8B57', '#556B2F'],
          metalness: 0.1,
          roughness: 0.8
        },
        cosmic: {
          name: 'Cosmic',
          colors: ['#4B0082', '#8A2BE2', '#00BFFF', '#FF00FF', '#9400D3'],
          metalness: 0.7,
          roughness: 0.3
        }
      };

      const parkEntities = [];

      function randomFrom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function randomGeometry() {
        const primitives = ['box', 'sphere', 'torusKnot', 'cylinder', 'icosahedron', 'octahedron', 'cone'];
        const primitive = randomFrom(primitives);
        const base = { primitive };

        switch (primitive) {
          case 'box':
            base.width = base.height = base.depth = 0.6;
            break;
          case 'sphere':
            base.radius = 0.5;
            break;
          case 'cylinder':
            base.radius = 0.4;
            base.height = 1.2;
            break;
          case 'torusKnot':
            base.radius = 0.7;
            base.radiusTubular = 0.18;
            break;
          case 'icosahedron':
          case 'octahedron':
            base.radius = 0.6;
            break;
          case 'cone':
            base.radiusBottom = 0.6;
            base.radiusTop = 0.1;
            base.height = 1.1;
            break;
        }
        return base;
      }

      function makeMaterial(themeKey) {
        const t = THEMES[themeKey] || THEMES.metallic;
        const mat = {
          color: randomFrom(t.colors),
          metalness: t.metalness,
          roughness: t.roughness
        };
        if (t.opacity) mat.opacity = t.opacity;
        if (t.transparent) mat.transparent = t.transparent;
        if (t.emissiveIntensity) {
          mat.emissive = mat.color;
          mat.emissiveIntensity = t.emissiveIntensity;
        }
        return mat;
      }

      function createSculpture(themeKey, position, sceneEl) {
        const root = document.createElement('a-entity');
        root.setAttribute('position', position);

        const art = document.createElement('a-entity');
        art.setAttribute('geometry', randomGeometry());
        art.setAttribute('material', makeMaterial(themeKey));

        const ySpin = 2400 + Math.random() * 6000;
        const xTilt = Math.random() > 0.5 ? '360 0 0' : '0 360 360';
        art.setAttribute('animation__spin', {
          property: 'rotation',
          to: xTilt,
          loop: true,
          dur: ySpin,
          easing: 'linear'
        });

        const pedestal = document.createElement('a-cylinder');
        pedestal.setAttribute('radius', 0.5);
        pedestal.setAttribute('height', 0.2);
        pedestal.setAttribute('position', '0 -0.7 0');
        pedestal.setAttribute('material', 'color: #333; metalness: 0.2; roughness: 0.9');

        root.appendChild(art);
        root.appendChild(pedestal);

        sceneEl.appendChild(root);
        parkEntities.push(root);
      }

      function clearPark(sceneEl) {
        console.log('Clearing park, sculptures:', parkEntities.length);
        parkEntities.forEach(ent => {
          if (ent.parentNode === sceneEl) {
            sceneEl.removeChild(ent);
          }
        });
        parkEntities.length = 0;
      }

      function generateArtPark(themeKey) {
        const sceneEl = document.querySelector('a-scene');
        if (!sceneEl || !sceneEl.camera) {
          alert('Enter AR first (tap AR button), then tap Generate Park.');
          console.warn('Scene or camera not ready');
          return;
        }

        clearPark(sceneEl);

        const camera = sceneEl.camera;
        const playerPos = new THREE.Vector3();
        camera.getWorldPosition(playerPos);
        console.log('Player position for park center:', playerPos);

        const numClusters = 6;
        const sculpturesPerCluster = 4;
        const minRadius = 5;
        const maxRadius = 20;

        for (let i = 0; i < numClusters; i++) {
          const angle = (Math.PI * 2 * i) / numClusters + Math.random() * 0.4;
          const radius = minRadius + Math.random() * (maxRadius - minRadius);

          const clusterCenter = new THREE.Vector3(
            playerPos.x + Math.cos(angle) * radius,
            playerPos.y,
            playerPos.z + Math.sin(angle) * radius
          );

          for (let j = 0; j < sculpturesPerCluster; j++) {
            const offsetRadius = 0.5 + Math.random() * 1.5;
            const offsetAngle = Math.random() * Math.PI * 2;

            const pos = new THREE.Vector3(
              clusterCenter.x + Math.cos(offsetAngle) * offsetRadius,
              playerPos.y,
              clusterCenter.z + Math.sin(offsetAngle) * offsetRadius
            );

            pos.y = Math.max(0.0, pos.y); // keep near ground

            createSculpture(themeKey, pos, sceneEl);
          }
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        console.log('DOM ready');
        const themeSelect = document.getElementById('themeSelect');
        const generateBtn = document.getElementById('generateBtn');
        const clearBtn = document.getElementById('clearBtn');

        generateBtn.addEventListener('click', () => {
          const theme = themeSelect.value;
          console.log('Generate park with theme:', theme);
          generateArtPark(theme);
        });

        clearBtn.addEventListener('click', () => {
          const sceneEl = document.querySelector('a-scene');
          if (sceneEl) clearPark(sceneEl);
        });
      });
    </script>
  </head>

  <body>
    <div id="hud">
      Theme:
      <select id="themeSelect">
        <option value="metallic">Metallic</option>
        <option value="neon">Neon</option>
        <option value="glass">Glass</option>
        <option value="nature">Nature</option>
        <option value="cosmic">Cosmic</option>
      </select>
      <button id="generateBtn">Generate Park</button>
      <button id="clearBtn">Clear Park</button>
    </div>
    <div id="hint">
      On your phone: tap the AR button to enter AR, then tap "Generate Park". Walk the field to explore.
    </div>

    <a-scene
      webxr="optionalFeatures: hit-test, local-floor;"
      xr-mode-ui="enabled: true"
      embedded
      vr-mode-ui="enabled: false"
      renderer="antialias: true; colorManagement: true;"
      device-orientation-permission-ui="enabled: true"
    >
      <!-- Camera -->
      <a-entity camera look-controls position="0 1.6 0"></a-entity>

      <!-- Lights -->
      <a-entity light="type: directional; intensity: 1.0" position="2 4 1"></a-entity>
      <a-entity light="type: directional; intensity: 0.5" position="-2 2 -3"></a-entity>
      <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    </a-scene>
  </body>
</html>
